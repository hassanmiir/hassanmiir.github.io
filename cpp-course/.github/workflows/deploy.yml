# Deploys this repository to GitHub Pages.
# Works from a PRIVATE repo: the source stays private, only the built
# site is published. Serves at https://<user>.github.io/<repo-name>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .        # publish the whole repo root (static files)

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
